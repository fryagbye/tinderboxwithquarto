name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python
      QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
      SMOKE_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh
