name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python
      QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
      SMOKE_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Chromium (mermaid/graphviz rendering)
        run: quarto install chromium

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install V8 runtime library
        # P3M's V8 binary for Ubuntu 24.04 links against libnode.so.109.
        run: sudo apt-get update && sudo apt-get install -y libnode109

      - name: Restore renv library
        uses: r-lib/actions/setup-renv@v2

      - name: Activate renv for subdirectory renders
        # Sub-project renders (output/, myproject/, ...) run Rscript from
        # their own directory, so the root .Rprofile is not loaded.
        # Sourcing renv/activate.R by absolute path activates the project
        # library regardless of cwd.
        run: echo 'source("${{ github.workspace }}/renv/activate.R")' > ~/.Rprofile

      - name: Run smoke tests
        run: bash scripts/smoke_test.sh
