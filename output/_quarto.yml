project:
  type: book
  output-dir: _booktypst

brand: _brand.yml

book:
  title: Tinderbox file for Quarto
  subtitle: How to use this file
  author: fryagbye
  
  

  chapters:

    - index.qmd

    - setup.qmd

    - usage-environment.qmd

    - setting.qmd

    - part: \"Book format\"

      chapters:

        - make-a-new-book-project.qmd

        - make-notes.qmd

        - chunks-and-graphs.qmd

        - rename-htmlexportfilename-of-a-note-with-translation.qmd

        - part-in-book-format.qmd

        - cross-reference-using-ziplink.qmd

        - export.qmd

        - example.qmd

    - part: \"Manuscript format\"

      chapters:

        - make-a-new-manuscript-project.qmd

        - make-manuscript-subproject.qmd

        - export-and-render.qmd

    - part: \"revealjs format\"

      chapters:

        - make-a-new-revealjs-project.qmd

        - make-revealjs-subproject.qmd

    - references.qmd

  appendices:

    - restrictions.qmd

format:
  typst:
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 3
    cite-method: citeproc

    code-link: true

    code-line-numbers: true

    mainfont: "Noto Sans JP"
    monofont: "Noto Sans Mono"
    indent: true
    fig-format: svg
    fig-dpi: 300
    callout-appearance: default


lang: en

bibliography: references.bib

papersize: a4

execute:
  cache: false
  
  freeze: auto

editor: source
