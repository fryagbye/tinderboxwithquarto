project:
  type: book
  output-dir: _bookhtml



book:
  title: 
  author: 
  reader-mode: true

  page-footer:
    left: |
      
    right: |
      
  
  
  
  
  repo-branch: main
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    pinned: true
  chapters:
    - index.qmd
    - index.qmd
    - part: "Tinderboxの導入"
      chapters:
        - about-tinderbox.qmd
        - installing-tinderbox.qmd
    - part: "Tinderboxの基礎"
      chapters:
        - components-of-a-note.qmd
        - understand-tinderboxs-interface.qmd
        - link.qmd
        - attributes.qmd
        - quick-stamp.qmd
        - display-expression.qmd
        - prototype-and-inheritance.qmd
        - other-views.qmd
        - aliases.qmd
        - agent.qmd
        - export.qmd
    - part: "Tinderboxの応用"
      chapters:
        - action-code-basics.qmd
        - stamps.qmd
        - automatic-execution.qmd
        - highlight.qmd
        - poster.qmd
        - this-book.qmd
    - references.qmd
  appendices:
    - appendix.qmd
    - objects-handled-by-tinderbox.qmd


format:
  html:
    theme:
      - cosmo
      
    code-link: true
    code-line-numbers: true
    toc: true
    toc-depth: 2
    number-sections: true
    number-depth: 0
    highlight-style: base16-atelier-dune
    link-external-newwindow: true
    pdf-engine: lualatex
    author-meta: ""
    indent: true
    include-in-header:
     - text: |

    
    
    page-layout: article
    
    callout-appearance: default

lightbox:
  match: auto
  effect: zoom
  desc-position: bottom
  loop: true








classoption: fleqn


execute:
  cache: false
  
  freeze: auto
  crossrefs-hover: false	

editor: visual

