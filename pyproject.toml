[project]
name = "tinderboxwithquarto"
version = "0.5.2"
description = ""
authors = [{ name = "fryagbye", email = "fryagbye@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "matplotlib>=3.10.0,<4",
    "plotly>=5.24.1,<6",
    "pandas>=2.2.3,<3",
    "jupyter-cache>=1.0.1,<2",
    "kaleido==0.2.1",
    "ipykernel>=6.29.5,<7",
    "panflute>=2.3.1,<3",
    "tornado>=6.5,<7",
    "jupyter>=1.1.1,<2",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
